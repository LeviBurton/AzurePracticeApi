# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - levi-azure-practice-api

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build AzurePractice.slnx --configuration Release

      - name: Run tests
        run: dotnet test AzurePractice.slnx --configuration Release --no-build

      - name: dotnet publish
        run: dotnet publish src/AzurePractice.Web/AzurePractice.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

      - name: Publish Azure Functions
        run: dotnet publish src/AzurePractice.Functions/AzurePractice.Functions.csproj -c Release -o ${{env.DOTNET_ROOT}}/functions

      - name: Upload Functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-functions
          path: ${{env.DOTNET_ROOT}}/functions

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9D02F885D43049CF9CA94234CA8ADB14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_277A1D1402BC41D3A23733197E1300EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E28171ACCF64B1FB962D28CDC396C76 }}

      - name: Set App Service startup command
        run: |
          az webapp config set \
            --resource-group AzurePracticeRG \
            --name levi-azure-practice-api \
            --startup-file "dotnet AzurePractice.Web.dll"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'levi-azure-practice-api'
          slot-name: 'Production'
          package: .

  deploy-functions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Functions artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-functions
          path: ./functions-package

      - name: Create .azurefunctions directory
        run: |
          mkdir -p .azurefunctions
          cp -r ./functions-package/* .azurefunctions/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9D02F885D43049CF9CA94234CA8ADB14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_277A1D1402BC41D3A23733197E1300EF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E28171ACCF64B1FB962D28CDC396C76 }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: levi-azure-practice-functions
          package: ./.azurefunctions
